<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cograph</title>
    <meta
      name="description"
      content="A shared architecture graph where your agent has a cursor."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#161310" />

    <!-- Social crawlers do not render SVG, so the card image is a PNG at an
         absolute URL. Both are required. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cograph" />
    <meta property="og:title" content="Cograph" />
    <meta
      property="og:description"
      content="A shared architecture graph where your agent has a cursor. People and AI agents edit the same board at the same time."
    />
    <meta property="og:url" content="https://cograph.rimzzlabs.com/" />
    <meta
      property="og:image"
      content="https://cograph.rimzzlabs.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Cograph board: three service cards joined by dependencies, with an agent cursor named Claude."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cograph" />
    <meta
      name="twitter:description"
      content="A shared architecture graph where your agent has a cursor."
    />
    <meta
      name="twitter:image"
      content="https://cograph.rimzzlabs.com/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
